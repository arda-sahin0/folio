name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use the test fixtures as vendor data
        run: cp tests/fixtures/*.csv data/

      - name: Create .env
        run: printf 'POSTGRES_USER=folio\nPOSTGRES_PASSWORD=folio\nPOSTGRES_DB=folio\nPOSTGRES_PORT=5432\n' > .env

      - name: Start Postgres
        run: docker compose up -d --wait

      - name: Migrate, load twice, test, run every query
        run: bash tests/run.sh

      - name: Database log
        if: failure()
        run: docker compose logs db

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile scripts
        run: python -m py_compile scripts/*.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v